<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>YUSHE BITES</title>
<link rel="icon" type="image/png" href="logo/logo.png">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
</head>
<body>

<div class="sidebar" id="sidebar">
  <div class="logo" style="padding:10px;text-align:center;border-bottom:1px solid #333">
    <img src="images/logo.png" style="width:50px;height:50px;border-radius:50%;background:white;object-fit:cover"><br><b style="font-size:12px">YUSHE BITES</b>
  </div>
  <div id="catSidebar"></div>
</div>

<div class="main">
  <h2 id="catTitle" style="margin-bottom:15px">Ice Creams</h2>
  <div class="grid" id="list"></div>
</div>

<div class="bar">
  <span id="cartText">🛒 0 items • ₱0</span>
  <button onclick="checkout()">PROCEED →</button>
</div>

<!-- PAYMENT MODAL -->
<div class="modal" id="payModal">
  <div class="modal-box">
    <h3>Choose Payment</h3><br>
    <button onclick="doPay('Cash')" style="width:100%;padding:16px;margin:6px 0;border:1px solid #ddd;border-radius:12px;background:white">💵 CASH</button>
    <button onclick="doPay('GCash')" style="width:100%;padding:16px;margin:6px 0;border:none;border-radius:12px;background:#007DFF;color:white">📱 GCash</button>
    <button onclick="doPay('Bank')" style="width:100%;padding:16px;margin:6px 0;border:1px solid #ddd;border-radius:12px;background:white">🏦 Bank Transfer</button>
    <br><button onclick="closePay()" style="margin-top:10px;border:none;background:none">Cancel</button>
  </div>
</div>

<!-- CONFIRM -->
<div class="modal" id="confirmModal">
  <div class="modal-box">
    <h1>✅ Order Confirmed!</h1>
    <h2 id="orderNum" style="font-size:42px;color:#FF6B6B;margin:10px 0"></h2>
    <div id="orderSummary" style="text-align:left;background:#f8f8f8;padding:15px;border-radius:12px;margin:15px 0"></div>
    <p>Please return phone to staff</p><br>
    <button onclick="location.reload()" style="width:100%;padding:14px;background:#111;color:white;border:none;border-radius:12px">New Order</button>
  </div>
</div>

<script>
 let categories = JSON.parse(localStorage.getItem('yushe_cats')) || ["Ice Creams","Drinks","Add-ons"];
 let products = JSON.parse(localStorage.getItem('yushe_products')) || JSON.parse(localStorage.getItem('kiosk_products')) || [
  {id:1,name:'Vanilla Scoop',price:50,cat:'Ice Creams',img:'images/vanilla.jpg',stock:50,available:true},
  {id:2,name:'Chocolate Scoop',price:55,cat:'Ice Creams',img:'images/chocolate.jpg',stock:50,available:true},
  {id:3,name:'Strawberry Scoop',price:55,cat:'Ice Creams',img:'images/strawberry.jpg',stock:50,available:true},
  {id:4,name:'Coke 350ml',price:30,cat:'Drinks',img:'images/coke.jpg',stock:50,available:true},
  {id:5,name:'Water',price:20,cat:'Drinks',img:'images/water.jpg',stock:50,available:true},
  {id:6,name:'Sprinkles',price:10,cat:'Add-ons',img:'images/sprinkles.jpg',stock:50,available:true},
 ];

 let current = categories[0];
 let cart={};

 function renderCats(){
   document.getElementById('catSidebar').innerHTML = categories.map((c,i)=>
     `<div class="cat ${c==current?'active':''}" onclick="setCat('${c}',this)"> ${c} </div>`
   ).join('');
   document.getElementById('catTitle').innerText = current;
 }
 function setCat(c,el){
   current=c; document.getElementById('catTitle').innerText=c;
   document.querySelectorAll('.cat').forEach(d=>d.classList.remove('active'));
   el.classList.add('active'); render();
 }
 function render(){
   let html='';
   products.filter(p=>p.cat==current).forEach(p=>{
     let q=cart[p.id]||0;
     let isNotAvailable = p.available === false; // <-- THIS IS THE FIX
     let isOutOfStock = p.stock <= 0;
     let isDisabled = isNotAvailable || isOutOfStock;

     html+=`<div class="card" style="${isDisabled?'opacity:0.5':''}">
       <div style="display:flex;gap:10px;align-items:center">
         <img src="${p.img}" style="width:60px;height:60px;border-radius:12px;object-fit:cover;background:#eee">
         <div><b>${p.name}</b><br><span class="price">₱${p.price}</span>
         ${isNotAvailable?'<br><small style="color:red;font-weight:bold">⛔ NOT AVAILABLE</small>': isOutOfStock?'<br><small style="color:red">SOLD OUT</small>':''}
         </div>
       </div>
       <div class="qty">${!isDisabled?`${q>0?`<button onclick="chg(${p.id},-1)">−</button><b>${q}</b>`:''}<button onclick="chg(${p.id},1)">+</button>`:`<small>—</small>`}</div>
     </div>`;
   });
   document.getElementById('list').innerHTML=html || '<p style="padding:20px;color:#999">No products in this category</p>';
   let tot=0,cnt=0; for(let id in cart){ let pr=products.find(x=>x.id==id); if(pr){ tot+=pr.price*cart[id]; cnt+=cart[id]; } }
   document.getElementById('cartText').innerText=`🛒 ${cnt} items • ₱${tot}`;
 }
 function chg(id,d){ cart[id]=(cart[id]||0)+d; if(cart[id]<=0) delete cart[id]; render(); }
 function checkout(){ if(Object.keys(cart).length==0){alert('Add item first!');return} document.getElementById('payModal').style.display='flex'; }
 function closePay(){ document.getElementById('payModal').style.display='none'; }
 function doPay(method){
   let tot=0; for(let id in cart) tot+=products.find(p=>p.id==id).price*cart[id];
   let num='A-'+Math.floor(Math.random()*900+100);
   let orders=JSON.parse(localStorage.getItem('kiosk_orders')||'[]');
   orders.push({order_number:num,items:Object.entries(cart).map(([id,q])=>{let p=products.find(x=>x.id==id);return {...p,qty:q}}),total:tot,method,time:new Date().toLocaleTimeString()});
   localStorage.setItem('kiosk_orders',JSON.stringify(orders));
   document.getElementById('payModal').style.display='none'; document.getElementById('confirmModal').style.display='flex';
   document.getElementById('orderNum').innerText=num;
   let s=''; for(let id in cart){ let p=products.find(x=>x.id==id); s+=`${p.name} x${cart[id]} - ₱${p.price*cart[id]}<br>`; }
   s+=`<hr style="margin:8px 0"><b>Total: ₱${tot}</b><br>Payment: ${method}`; document.getElementById('orderSummary').innerHTML=s;
 }
 renderCats(); render();
</script>
</body>
</html>
