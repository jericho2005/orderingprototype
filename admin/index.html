<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Kiosk</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial;background:#f2f2f2;padding:15px}
.header{background:#111;color:white;padding:15px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;flex-wrap:wrap;gap:10px}
.order{background:white;border-radius:12px;padding:15px;margin-bottom:10px;box-shadow:0 2px 6px rgba(0,0,0,0.05);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
.order b{color:#FF6B6B}
.btn{border:none;padding:8px 14px;border-radius:8px;cursor:pointer}
.btn-done{background:#111;color:white}
.btn-clear{background:#ff4444;color:white;padding:12px;width:100%;margin-top:20px;border-radius:12px;font-weight:bold}
/* PC view */
@media(min-width:1024px){
  body{max-width:800px;margin:0 auto;padding:30px}
  .order{padding:20px}
}
</style>
</head>
<body>

<div class="header">
  <h2>🧾 Live Orders - Admin</h2>
  <div>
    <button class="btn" style="background:#333;color:white" onclick="location.reload()">🔄 Refresh</button>
    <button class="btn" style="background:#FF6B6B;color:white" onclick="window.location.href='../'">← Kiosk</button>
  </div>
</div>

<div style="background:white;padding:12px;border-radius:10px;margin-bottom:15px">
  <small>Auto-refresh every 2 seconds • Works on PC & Phone</small><br>
  <b id="totalOrders">0 orders today</b>
</div>

<div id="ordersList"></div>

<button class="btn-clear" onclick="clearOrders()">🗑️ Clear All Orders</button>

<script>
function load(){
  let orders=JSON.parse(localStorage.getItem('kiosk_orders')||'[]');
  document.getElementById('totalOrders').innerText=orders.length+' orders today';
  let div=document.getElementById('ordersList'); div.innerHTML='';
  if(orders.length==0) div.innerHTML='<div style="text-align:center;padding:40px;color:#999">No orders yet<br>Orders from kiosk will appear here</div>';
  
  [...orders].reverse().forEach((o,i)=>{
    div.innerHTML+=`
    <div class="order">
      <div>
        <b style="font-size:20px">${o.order_number}</b> • ${o.time}<br>
        <span style="background:#eee;padding:2px 8px;border-radius:20px;font-size:12px">${o.method}</span><br><br>
        ${o.items.map(it=>`${it.emoji||''} ${it.name} x${it.qty||it.quantity}`).join('<br>')}
      </div>
      <div style="text-align:right">
        <div style="font-size:18px;font-weight:bold">₱${o.total}</div><br>
        <button class="btn btn-done" onclick="markDone(${orders.length-1-i})">Mark Done ✅</button>
      </div>
    </div>`;
  });
}
function clearOrders(){ if(confirm('Clear all orders?')){ localStorage.removeItem('kiosk_orders'); load(); } }
function markDone(index){
  let orders=JSON.parse(localStorage.getItem('kiosk_orders')||'[]');
  orders.splice(index,1);
  localStorage.setItem('kiosk_orders',JSON.stringify(orders));
  load();
}
load(); setInterval(load,2000);
</script>
</body>
</html>
